<!doctype html>
<html lang="ko">
  <head>
    <title>킹데이트 관리자</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1A1A1D;
        color: #E5E5E5;
        min-height: 100vh;
        line-height: 1.5;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
        padding-bottom: 16px;
        border-bottom: 1px solid #333;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        color: #C4A875;
      }
      .tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .tab {
        padding: 10px 20px;
        background: #2A2A2D;
        border: 1px solid #333;
        border-radius: 8px;
        color: #999;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .tab:hover {
        background: #333;
      }
      .tab.active {
        background: #6B5B95;
        border-color: #6B5B95;
        color: #fff;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: #2A2A2D;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
      }
      .stat-label {
        font-size: 13px;
        color: #888;
        margin-bottom: 8px;
      }
      .stat-value {
        font-size: 28px;
        font-weight: 700;
        color: #C4A875;
      }
      .card {
        background: #2A2A2D;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .user-info {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .user-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #6B5B95;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: #fff;
        font-size: 18px;
      }
      .user-details h3 {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 4px;
      }
      .user-details p {
        font-size: 13px;
        color: #888;
      }
      .status-badge {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-pending {
        background: #C4A875;
        color: #1A1A1D;
      }
      .status-approved {
        background: #4CAF50;
        color: #fff;
      }
      .status-rejected {
        background: #F44336;
        color: #fff;
      }
      .card-body {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
        padding: 16px;
        background: #1A1A1D;
        border-radius: 8px;
      }
      .info-item label {
        font-size: 12px;
        color: #888;
        display: block;
        margin-bottom: 4px;
      }
      .info-item span {
        font-size: 14px;
        color: #E5E5E5;
      }
      .card-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }
      .btn {
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }
      .btn-approve {
        background: #4CAF50;
        color: #fff;
      }
      .btn-approve:hover {
        background: #43A047;
      }
      .btn-reject {
        background: #F44336;
        color: #fff;
      }
      .btn-reject:hover {
        background: #E53935;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #888;
      }
      .empty-state h3 {
        font-size: 18px;
        margin-bottom: 8px;
        color: #999;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #888;
      }
      .refresh-btn {
        background: #333;
        color: #E5E5E5;
        padding: 8px 16px;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      .refresh-btn:hover {
        background: #444;
      }
      .sub-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .sub-tab {
        padding: 8px 16px;
        background: transparent;
        border: 1px solid #444;
        border-radius: 6px;
        color: #888;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
      }
      .sub-tab:hover {
        background: #333;
      }
      .sub-tab.active {
        background: #333;
        border-color: #6B5B95;
        color: #C4A875;
      }
      .member-card {
        background: #2A2A2D;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 12px;
      }
      .member-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 16px;
      }
      .member-info .info-item {
        padding: 8px 0;
      }
      .member-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #333;
      }
      .expiry-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .expiry-active {
        background: #4CAF50;
        color: #fff;
      }
      .expiry-warning {
        background: #FF9800;
        color: #1A1A1D;
      }
      .membership-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        margin-left: auto;
      }
      .membership-payment_pending {
        background: #C4A875;
        color: #1A1A1D;
      }
      .membership-active {
        background: #4CAF50;
        color: #fff;
      }
      .membership-expiring_soon {
        background: #FF9800;
        color: #1A1A1D;
      }
      .membership-expired {
        background: #9E9E9E;
        color: #fff;
      }
      .membership-suspended {
        background: #FF5722;
        color: #fff;
      }
      .membership-banned {
        background: #F44336;
        color: #fff;
      }
      .membership-no_membership {
        background: #607D8B;
        color: #fff;
      }
      .membership-not_verified {
        background: #FF9800;
        color: #fff;
      }
      .member-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #333;
      }
      .btn-small {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 6px;
      }
      .btn-suspend {
        background: #FF5722;
        color: #fff;
      }
      .btn-suspend:hover {
        background: #E64A19;
      }
      .btn-ban {
        background: #F44336;
        color: #fff;
      }
      .btn-ban:hover {
        background: #D32F2F;
      }
      .btn-unsuspend, .btn-unban {
        background: #4CAF50;
        color: #fff;
      }
      .btn-unsuspend:hover, .btn-unban:hover {
        background: #43A047;
      }
      .btn-reset-pw {
        background: #2196F3;
        color: #fff;
      }
      .btn-reset-pw:hover {
        background: #1976D2;
      }
      .btn-delete {
        background: #B71C1C;
        color: #fff;
      }
      .btn-delete:hover {
        background: #7F0000;
      }
      .members-sub-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .reason-text {
        font-size: 12px;
        color: #FF9800;
        margin-top: 4px;
      }
      .timeline {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: rgba(26, 26, 29, 0.6);
        border-radius: 8px;
        margin-top: 12px;
      }
      .timeline-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .timeline-icon {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
      }
      .timeline-icon.deposit { background: #C4A875; color: #1A1A1D; }
      .timeline-icon.approved { background: #4CAF50; color: #fff; }
      .timeline-icon.start { background: #2196F3; color: #fff; }
      .timeline-icon.expiry { background: #FF9800; color: #1A1A1D; }
      .timeline-icon.renewal { background: #9C27B0; color: #fff; }
      .timeline-icon.pending { background: #607D8B; color: #fff; }
      .timeline-label {
        font-size: 12px;
        color: #aaa;
        width: 60px;
      }
      .timeline-value {
        font-size: 13px;
        color: #fff;
        flex: 1;
      }
      .renewal-badge {
        background: linear-gradient(135deg, #9C27B0 0%, #673AB7 100%);
        color: #fff;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
      }
      .conversation-card {
        background: #2A2A2D;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .conversation-card:hover {
        background: #333;
        border-color: #6B5B95;
      }
      .conversation-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .conversation-users {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .user-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: #1A1A1D;
        border-radius: 20px;
        font-size: 13px;
      }
      .user-pill.male { border: 1px solid #4FC3F7; color: #4FC3F7; }
      .user-pill.female { border: 1px solid #F48FB1; color: #F48FB1; }
      .arrow-icon { color: #888; }
      .conversation-meta {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: #888;
      }
      .message-count {
        color: #C4A875;
        font-weight: 600;
      }
      .msg-count-badge {
        display: inline-block;
        background: rgba(196, 168, 117, 0.2);
        color: #C4A875;
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        margin-left: 4px;
      }
      .one-way-badge {
        background: rgba(255, 152, 0, 0.2);
        color: #FFB74D;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .two-way-badge {
        background: rgba(76, 175, 80, 0.2);
        color: #81C784;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .conversation-card.one-way {
        border-left: 3px solid #FFB74D;
      }
      .last-message-preview {
        background: #1A1A1D;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        color: #aaa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-content {
        background: #2A2A2D;
        border-radius: 16px;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #333;
      }
      .modal-header h3 {
        color: #C4A875;
        font-size: 18px;
      }
      .modal-close {
        background: none;
        border: none;
        color: #888;
        font-size: 24px;
        cursor: pointer;
      }
      .modal-close:hover {
        color: #fff;
      }
      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .message-bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        position: relative;
      }
      .message-bubble.sent {
        align-self: flex-end;
        background: #6B5B95;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .message-bubble.received {
        align-self: flex-start;
        background: #333;
        color: #E5E5E5;
        border-bottom-left-radius: 4px;
      }
      .message-sender {
        font-size: 11px;
        color: #888;
        margin-bottom: 4px;
      }
      .message-time {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 4px;
        text-align: right;
      }
      .message-bubble.received .message-time {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>킹데이트 관리자</h1>
        <div style="display: flex; gap: 12px;">
          <button class="refresh-btn" onclick="loadData()">새로고침</button>
          <button class="refresh-btn" onclick="logout()" style="background: #F44336; border-color: #F44336;">로그아웃</button>
        </div>
      </header>

      <div class="tabs">
        <button class="tab active" data-section="requests" onclick="setSection('requests')">결제 요청</button>
        <button class="tab" data-section="members" onclick="setSection('members')">회원 관리</button>
        <button class="tab" data-section="messages" onclick="setSection('messages')">메시지 조회</button>
      </div>

      <div id="requests-section">
        <div class="sub-tabs">
          <button class="sub-tab active" data-filter="pending" onclick="setFilter('pending')">대기 중</button>
          <button class="sub-tab" data-filter="approved" onclick="setFilter('approved')">승인됨</button>
          <button class="sub-tab" data-filter="rejected" onclick="setFilter('rejected')">거절됨</button>
          <button class="sub-tab" data-filter="all" onclick="setFilter('all')">전체</button>
        </div>
      </div>

      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="stat-label">대기 중</div>
          <div class="stat-value" id="stat-pending">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">승인됨</div>
          <div class="stat-value" id="stat-approved">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">거절됨</div>
          <div class="stat-value" id="stat-rejected">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">총 요청</div>
          <div class="stat-value" id="stat-total">-</div>
        </div>
      </div>

      <div id="requests-list">
        <div class="loading">로딩 중...</div>
      </div>

      <div id="members-section" style="display: none;">
        <div class="members-sub-tabs">
          <button class="sub-tab active" data-member-filter="all" onclick="setMemberFilter('all')">전체</button>
          <button class="sub-tab" data-member-filter="payment_pending" onclick="setMemberFilter('payment_pending')">결제 대기</button>
          <button class="sub-tab" data-member-filter="active" onclick="setMemberFilter('active')">승인 완료</button>
          <button class="sub-tab" data-member-filter="expiring_soon" onclick="setMemberFilter('expiring_soon')">만료 예정</button>
          <button class="sub-tab" data-member-filter="expired" onclick="setMemberFilter('expired')">만료</button>
          <button class="sub-tab" data-member-filter="not_verified" onclick="setMemberFilter('not_verified')">휴대폰 미인증</button>
          <button class="sub-tab" data-member-filter="suspended" onclick="setMemberFilter('suspended')">정지</button>
          <button class="sub-tab" data-member-filter="banned" onclick="setMemberFilter('banned')">영구 차단</button>
        </div>
        <div class="stats" id="members-stats">
          <div class="stat-card">
            <div class="stat-label">전체 회원</div>
            <div class="stat-value" id="stat-total-members">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">결제 대기</div>
            <div class="stat-value" id="stat-payment-pending">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">승인 완료</div>
            <div class="stat-value" id="stat-active-members">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">만료 예정</div>
            <div class="stat-value" id="stat-expiring-soon">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">만료</div>
            <div class="stat-value" id="stat-expired">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">정지</div>
            <div class="stat-value" id="stat-suspended">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">영구 차단</div>
            <div class="stat-value" id="stat-banned">-</div>
          </div>
        </div>
        <div id="members-list">
          <div class="loading">로딩 중...</div>
        </div>
      </div>

      <div id="messages-section" style="display: none;">
        <div class="stats" id="messages-stats">
          <div class="stat-card">
            <div class="stat-label">총 대화</div>
            <div class="stat-value" id="stat-total-conversations">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">일방적 대화</div>
            <div class="stat-value" id="stat-one-way-conversations">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">양방향 대화</div>
            <div class="stat-value" id="stat-two-way-conversations">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">총 메시지</div>
            <div class="stat-value" id="stat-total-messages">-</div>
          </div>
        </div>
        <div id="conversations-list">
          <div class="loading">로딩 중...</div>
        </div>
        <div id="message-detail-modal" class="modal" style="display: none;">
          <div class="modal-content">
            <div class="modal-header">
              <h3 id="modal-title">대화 내용</h3>
              <button class="modal-close" onclick="closeMessageModal()">&times;</button>
            </div>
            <div id="messages-container" class="messages-container">
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Check authentication
      const adminToken = localStorage.getItem('admin_token');
      if (!adminToken) {
        window.location.href = '/admin';
      }

      function logout() {
        localStorage.removeItem('admin_token');
        window.location.href = '/admin';
      }

      let allRequests = [];
      let allMembers = [];
      let allConversations = [];
      let currentFilter = 'pending';
      let currentMemberFilter = 'all';
      let currentSection = 'requests';

      async function loadData() {
        await Promise.all([loadRequests(), loadMembers(), loadConversations()]);
      }

      async function loadRequests() {
        try {
          const response = await fetch('/api/admin/payment-requests');
          const data = await response.json();
          
          if (data.success) {
            allRequests = data.requests;
            updateStats();
            renderRequests();
          }
        } catch (error) {
          console.error('Failed to load requests:', error);
          document.getElementById('requests-list').innerHTML = 
            '<div class="empty-state"><h3>데이터를 불러올 수 없습니다</h3><p>서버 연결을 확인해주세요.</p></div>';
        }
      }

      async function loadMembers() {
        try {
          const response = await fetch('/api/admin/members');
          const data = await response.json();
          
          if (data.success) {
            allMembers = data.members;
            updateMemberStats();
            renderMembers();
          }
        } catch (error) {
          console.error('Failed to load members:', error);
          document.getElementById('members-list').innerHTML = 
            '<div class="empty-state"><h3>데이터를 불러올 수 없습니다</h3><p>서버 연결을 확인해주세요.</p></div>';
        }
      }

      function updateMemberStats() {
        const stats = {
          total: allMembers.length,
          payment_pending: allMembers.filter(m => m.membershipStatus === 'payment_pending').length,
          active: allMembers.filter(m => m.membershipStatus === 'active').length,
          expiring_soon: allMembers.filter(m => m.membershipStatus === 'expiring_soon').length,
          expired: allMembers.filter(m => m.membershipStatus === 'expired').length,
          not_verified: allMembers.filter(m => m.membershipStatus === 'not_verified').length,

      async function loadConversations() {
        try {
          const response = await fetch('/api/admin/conversations');
          const data = await response.json();
          
          if (data.success) {
            allConversations = data.conversations;
            updateConversationStats();
            renderConversations();
          }
        } catch (error) {
          console.error('Failed to load conversations:', error);
          document.getElementById('conversations-list').innerHTML = 
            '<div class="empty-state"><h3>데이터를 불러올 수 없습니다</h3><p>서버 연결을 확인해주세요.</p></div>';
        }
      }

      function updateConversationStats() {
        const totalConversations = allConversations.length;
        const oneWayConversations = allConversations.filter(c => c.isOneWay).length;
        const twoWayConversations = totalConversations - oneWayConversations;
        const totalMessages = allConversations.reduce((sum, c) => sum + (c.messageCount || 0), 0);
        
        document.getElementById('stat-total-conversations').textContent = totalConversations;
        document.getElementById('stat-one-way-conversations').textContent = oneWayConversations;
        document.getElementById('stat-two-way-conversations').textContent = twoWayConversations;
        document.getElementById('stat-total-messages').textContent = totalMessages;
      }

      function renderConversations() {
        if (allConversations.length === 0) {
          document.getElementById('conversations-list').innerHTML = 
            '<div class="empty-state"><h3>대화가 없습니다</h3><p>아직 사용자 간 대화가 없습니다.</p></div>';
          return;
        }

        const html = allConversations.map(conv => {
          const user1 = conv.user1 || {};
          const user2 = conv.user2 || {};
          const lastMessage = conv.lastMessage;
          const lastMessageTime = lastMessage ? new Date(lastMessage.createdAt).toLocaleString('ko-KR') : '-';
          const lastMessagePreview = lastMessage ? lastMessage.content : '메시지 없음';

          const isOneWay = conv.isOneWay;
          const user1MsgCount = conv.user1MessageCount || 0;
          const user2MsgCount = conv.user2MessageCount || 0;
          const arrowIcon = isOneWay ? '→' : '↔';

          return `
            <div class="conversation-card ${isOneWay ? 'one-way' : ''}" onclick="viewConversationMessages('${conv.id}')">
              <div class="conversation-header">
                <div class="conversation-users">
                  <span class="user-pill ${user1.gender || 'male'}">
                    ${user1.name || '알 수 없음'} (${user1.gender === 'male' ? '남' : '여'}) <span class="msg-count-badge">${user1MsgCount}</span>
                  </span>
                  <span class="arrow-icon">${arrowIcon}</span>
                  <span class="user-pill ${user2.gender || 'female'}">
                    ${user2.name || '알 수 없음'} (${user2.gender === 'male' ? '남' : '여'}) <span class="msg-count-badge">${user2MsgCount}</span>
                  </span>
                </div>
                <div class="conversation-meta">
                  ${isOneWay ? '<span class="one-way-badge">일방적</span>' : '<span class="two-way-badge">양방향</span>'}
                  <span class="message-count">${conv.messageCount || 0}개 메시지</span>
                  <span>${lastMessageTime}</span>
                </div>
              </div>
              <div class="last-message-preview">${lastMessagePreview}</div>

        document.getElementById('conversations-list').innerHTML = html;

      async function viewConversationMessages(conversationId) {
        try {
          const response = await fetch(`/api/admin/conversations/${conversationId}/messages`);
          const data = await response.json();
          
          if (data.success) {
            const { conversation, messages } = data;
            const user1 = conversation.user1 || {};
            const user2 = conversation.user2 || {};
            
            document.getElementById('modal-title').textContent = 
              `${user1.name || '알 수 없음'} ↔ ${user2.name || '알 수 없음'}`;
            
            if (messages.length === 0) {
              document.getElementById('messages-container').innerHTML = 
                '<div class="empty-state"><p>아직 주고받은 메시지가 없습니다.</p></div>';
            } else {
              const messagesHtml = messages.map(msg => {
                const sender = msg.senderId === user1.id ? user1 : user2;
                const isUser1 = msg.senderId === user1.id;
                const messageTime = new Date(msg.createdAt).toLocaleString('ko-KR');
                
                return `
                  <div class="message-bubble ${isUser1 ? 'sent' : 'received'}">
                    <div class="message-sender">${sender.name || '알 수 없음'}</div>
                    <div class="message-content">${msg.content}</div>
                    <div class="message-time">${messageTime}</div>
                  </div>
                `;
              }).join('');
              
              document.getElementById('messages-container').innerHTML = messagesHtml;
            }
            
            document.getElementById('message-detail-modal').style.display = 'flex';
          }
        } catch (error) {
          console.error('Failed to load messages:', error);
          alert('메시지를 불러오는데 실패했습니다.');
        }
      }

      async function suspendUser(userId) {
        const reason = prompt('정지 사유를 입력해주세요:');
        if (reason === null) return;
        
        try {
          const response = await fetch(`/api/admin/users/${userId}/suspend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason })
          });
          
          const data = await response.json();
          if (data.success) {
            loadMembers();
          } else {
            alert('정지 처리에 실패했습니다: ' + (data.message || '알 수 없는 오류'));
          }
        } catch (error) {
          console.error('Suspend error:', error);
          alert('정지 처리 중 오류가 발생했습니다.');
        }
      }

      async function unsuspendUser(userId) {
        if (!confirm('정지를 해제하시겠습니까?')) return;
        
        try {
          const response = await fetch(`/api/admin/users/${userId}/unsuspend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          
          const data = await response.json();
          if (data.success) {
            loadMembers();
          } else {
            alert('정지 해제에 실패했습니다: ' + (data.message || '알 수 없는 오류'));
          }
        } catch (error) {
          console.error('Unsuspend error:', error);
          alert('정지 해제 중 오류가 발생했습니다.');
        }
      }

      async function resetPassword(userId, userName) {
        const newPassword = prompt(`${userName}님의 새 비밀번호를 입력해주세요 (최소 6자):`, '');
        if (newPassword === null) return;
        
        if (newPassword.length < 6) {
          alert('비밀번호는 최소 6자 이상이어야 합니다.');
          return;
        }
        
        if (!confirm(`${userName}님의 비밀번호를 "${newPassword}"로 변경하시겠습니까?`)) return;
        
        try {
          const response = await fetch(`/api/admin/users/${userId}/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ newPassword })
          });
          
          const data = await response.json();
          if (data.success) {
            alert(`비밀번호가 성공적으로 변경되었습니다.\n새 비밀번호: ${newPassword}\n\n사용자에게 이 비밀번호를 전달해주세요.`);
          } else {
            alert('비밀번호 변경에 실패했습니다: ' + (data.message || '알 수 없는 오류'));
          }
        } catch (error) {
          console.error('Reset password error:', error);
          alert('비밀번호 변경 중 오류가 발생했습니다.');
        }
      }

      async function approveRequest(id, depositorName, amount) {
        // Step 1: Require confirmation that payment was verified
        const confirmPayment = prompt(
          '⚠️ 입금 확인 필수 ⚠️\n\n' +
          '입금자명: ' + depositorName + '\n' +
          '금액: ' + (amount || 250000).toLocaleString() + '원\n\n' +
          '실제 입금을 확인하셨습니까?\n' +
          '확인하셨다면 아래에 입금자명을 정확히 입력해주세요:'
        );
        
        if (confirmPayment === null) return;
        
        if (confirmPayment.trim() !== depositorName.trim()) {
          alert('❌ 입금자명이 일치하지 않습니다.\n\n입력: ' + confirmPayment + '\n원본: ' + depositorName + '\n\n입금 확인 후 다시 시도해주세요.');
          return;
        }
        
        // Step 2: Final confirmation
        if (!confirm('✅ 입금자명 확인 완료\n\n정말로 이 결제 요청을 승인하시겠습니까?\n승인 시 킹 멤버십이 즉시 활성화됩니다.')) return;
        
        try {
          const response = await fetch(`/api/admin/payment-requests/${id}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminId: 'admin' })
          });
          
          const data = await response.json();
          if (data.success) {
            alert('✅ 승인 완료!\n\n' + depositorName + '님의 킹 멤버십이 활성화되었습니다.');
            loadData();
          } else {
            alert('승인 처리에 실패했습니다: ' + (data.message || '알 수 없는 오류'));
          }
        } catch (error) {
          console.error('Approve error:', error);
          alert('승인 처리 중 오류가 발생했습니다.');
        }
      }

      async function rejectRequest(id) {
        const notes = prompt('거절 사유를 입력해주세요 (선택사항):');
        if (notes === null) return;
        
        try {
          const response = await fetch(`/api/admin/payment-requests/${id}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminId: 'admin', notes })
          });
          
          const data = await response.json();
          if (data.success) {
            loadData();
          } else {
            alert('거절 처리에 실패했습니다: ' + (data.message || '알 수 없는 오류'));
          }
        } catch (error) {
          console.error('Reject error:', error);
          alert('거절 처리 중 오류가 발생했습니다.');
        }
      }

      loadData();
    </script>
  </body>
</html>
